stages:
  - build
  - test
  - docker
  - deploy

build-job:
  stage: build
  image: node:20-alpine
  script:
    - npm install

test-job:
  stage: test
  image: node:20-alpine
  script:
    - npm install
    - npm test

docker-build:
  stage: docker
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t ecommerce-backend .

deploy:
  stage: deploy
  script:
    - echo "Deploying to AWS EC2"
